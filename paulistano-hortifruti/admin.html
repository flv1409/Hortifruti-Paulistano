<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Paulistano Hortifruti</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/jpg" href="assets/logo.jpg">
    <style>
        :root { --primary: #1b4332; --accent: #2d6a4f; --gold: #ffb703; --danger: #e63946; }
        body { font-family: 'Poppins', sans-serif; background: #f0f2f1; padding: 20px; }
        .admin-container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 30px; }
        
        /* Painel de Promoções */
        .promo-box { background: #fff8e1; border: 2px dashed var(--gold); padding: 20px; border-radius: 10px; margin-bottom: 40px; }
        .promo-flex { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        
        /* Tabela de Preços */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; background: var(--primary); color: white; padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .price-input { width: 80px; font-weight: bold; color: var(--accent); }
        
        .btn { border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-save { background: var(--primary); color: white; }
        .btn-promo { background: var(--gold); color: var(--primary); }
        .btn-remove { background: var(--danger); color: white; font-size: 0.8rem; }
        
        .badge-promo { background: var(--gold); color: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1><i class="fas fa-cash-register"></i> Gestão de Preços e Ofertas</h1>

    <!-- Módulo de Promoção -->
    <div class="promo-box">
        <h3><i class="fas fa-percentage"></i> Criar Promoção Relâmpago</h3>
        <div class="promo-flex">
            <div class="form-group">
                <label>Produto</label>
                <select id="promoProductSelect"></select>
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="promoType">
                    <option value="fixed">Preço Fixo (R$)</option>
                    <option value="percent">Desconto (%)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Valor</label>
                <input type="number" id="promoValue" step="0.01" placeholder="Ex: 5.99 ou 20">
            </div>
            <button class="btn btn-promo" onclick="applyPromo()">Aplicar Oferta</button>
        </div>
    </div>

    <!-- Tabela Geral -->
    <h3>Lista de Produtos</h3>
    <table id="adminTable">
        <thead>
            <tr>
                <th>Produto</th>

                <th>Status / Promoção</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="adminProductList"></tbody>

</div>

            {id: 65, cat: "Ovos", name: "Ovo Caipira", unit: "10 unidades", price: 12.99, img: "ovos/ovos_caipira.jpg" }
        ];

    let products = JSON.parse(localStorage.getItem('hortifruti_db')) || initialProducts;

    function save() {
        localStorage.setItem('hortifruti_db', JSON.stringify(products));
        render();
    }

    function render() {
        const list = document.getElementById('adminProductList');
        const select = document.getElementById('promoProductSelect');
        
        list.innerHTML = '';
        select.innerHTML = '';

        products.forEach(p => {
            // Render Table
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${p.name} <br><small>${p.unit}</small></td>
                <td>R$ <input type="number" step="0.01" class="price-input" value="${p.price}" onchange="updateBasePrice(${p.id}, this.value)"></td>
                <td>
                    ${p.promoPrice ? `<span class="badge-promo">OFERTA: R$ ${p.promoPrice.toFixed(2)}</span>` : '<small>Preço Normal</small>'}
                </td>
                <td>
                    ${p.promoPrice ? `<button class="btn btn-remove" onclick="removePromo(${p.id})">Remover Promo</button>` : ''}
                </td>
            `;
            list.appendChild(row);

            // Render Select
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.name;
            select.appendChild(opt);
        });
    }

    function updateBasePrice(id, value) {
        const idx = products.findIndex(p => p.id === id);
        products[idx].price = parseFloat(value);
        save();
    }

    function applyPromo() {
        const id = parseInt(document.getElementById('promoProductSelect').value);
        const type = document.getElementById('promoType').value;
        const val = parseFloat(document.getElementById('promoValue').value);
        const idx = products.findIndex(p => p.id === id);

        if(isNaN(val)) return alert("Insira um valor válido");

        if(type === 'fixed') {
            products[idx].promoPrice = val;
        } else {
            products[idx].promoPrice = products[idx].price * (1 - val/100);
        }
        
        save();
        document.getElementById('promoValue').value = '';
    }

    function removePromo(id) {
        const idx = products.findIndex(p => p.id === id);
        products[idx].promoPrice = null;
        save();
    }

    render();
</script>

</html>
